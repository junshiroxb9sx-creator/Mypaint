<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1,
        maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>MyPaint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>お絵かき</h1>
    <div id="toolbar">
      <button type="button" class="color active" data-color="#000000">黒</button>
      <button type="button" class="color" data-color="#e60012">赤</button>
      <button type="button" class="color" data-color="#0068b7">青</button>
      <button type="button" class="color" data-color="#009944">緑</button>
      <label>太さ
        <select id="lineWidth">
          <option value="2">細い</option>
          <option value="5" selected>普通</option>
          <option value="10">太い</option>
        </select>
      </label>
      <button type="button" id="eraser">消しゴム</button>
      <button type="button" id="clear">全部消す</button>
      <button type="button" id="save">画像を表示</button>
    </div>
    <div id="canvasWrap"><canvas id="canvas"></canvas></div>
    <p id="message">指またはマウスで白い部分に描いてください。</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
