<!DOCTYPE html>
<html lang="ja" manifest="mypaint.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>MyPaint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <h1>MyPaint</h1>

  <div id="toolbar">
    <div class="toolSection">
      <span class="toolTitle">色</span>
      <div id="palette">
        <button class="color active" data-color="#000000" style="background:#000000" title="黒"></button>
        <button class="color" data-color="#808080" style="background:#808080" title="灰"></button>
        <button class="color white" data-color="#ffffff" style="background:#ffffff" title="白"></button>
        <button class="color" data-color="#e60012" style="background:#e60012" title="赤"></button>
        <button class="color" data-color="#f39800" style="background:#f39800" title="橙"></button>
        <button class="color" data-color="#fff100" style="background:#fff100" title="黄"></button>
        <button class="color" data-color="#009944" style="background:#009944" title="緑"></button>
        <button class="color" data-color="#00a0e9" style="background:#00a0e9" title="水色"></button>
        <button class="color" data-color="#0068b7" style="background:#0068b7" title="青"></button>
        <button class="color" data-color="#920783" style="background:#920783" title="紫"></button>
        <button class="color" data-color="#8b4513" style="background:#8b4513" title="茶"></button>
        <button class="color" data-color="#f19ec2" style="background:#f19ec2" title="桃"></button>
      </div>
      <label class="customColor">自由色 <input type="color" id="colorPicker" value="#000000"></label>
      <span>現在色</span><span id="currentColor"></span>
    </div>

    <div class="toolSection">
      <span class="toolTitle">ペンの太さ</span>
      <button class="penSize active" data-size="2" title="極細"><span style="height:2px"></span></button>
      <button class="penSize" data-size="5" title="細"><span style="height:5px"></span></button>
      <button class="penSize" data-size="10" title="太"><span style="height:10px"></span></button>
      <button class="penSize" data-size="20" title="極太"><span style="height:20px"></span></button>
      <button id="penMode">ペン</button>
    </div>

    <div class="toolSection">
      <span class="toolTitle">消しゴムの太さ</span>
      <button class="eraserSize" data-size="10" title="細"><span style="width:10px;height:10px"></span></button>
      <button class="eraserSize active" data-size="20" title="中"><span style="width:20px;height:20px"></span></button>
      <button class="eraserSize" data-size="40" title="太"><span style="width:40px;height:40px"></span></button>
      <button class="eraserSize" data-size="80" title="特大"><span style="width:80px;height:80px"></span></button>
      <button id="eraserMode">消しゴム</button>
    </div>

    <div class="toolSection actions">
      <button id="undo">元に戻す</button>
      <button id="redo">前に進む</button>
      <button id="clear">全部消す</button>
      <button id="png">PNG表示</button>
      <button id="saveWork">作品保存</button>
      <select id="workList"><option value="">保存作品を選択</option></select>
      <button id="loadWork">読込</button>
      <button id="deleteWork">削除</button>
    </div>
  </div>

  <div id="paperFrame">
    <div id="canvasWrap">
      <canvas id="canvas" width="760" height="500"></canvas>
      <div id="eraserCursor"></div>
    </div>
  </div>
  <p id="message">ペンを選び、白い枠内に描いてください。</p>
</div>
<script src="script.js"></script>
</body>
</html>
