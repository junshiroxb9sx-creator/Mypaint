<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MyPaint</title>

<style>
#canvas {
    border: 5px solid #000;
    touch-action: none; /* ★ iPadで描けるようになる最重要ポイント */
}

/* 色ボタン */
.color {
    width: 55px;
    height: 55px;
    border: 2px solid #444;
    box-sizing: border-box;
}
.color.white {
    border-color: #222;
    border-width: 3px;
}

/* ペン太さボタン（横一列） */
.penSizeRow {
    display: flex;
    gap: 6px;
}
.penSize {
    width: 55px;
    height: 55px;
    border: 2px solid #444;
    display: flex;
    justify-content: center;
    align-items: center;
}
.penSize span {
    width: 100%;
    background: #000;
}

/* 消しゴム太さボタン（横一列・正円） */
.eraserSizeRow {
    display: flex;
    gap: 6px;
}
.eraserSize {
    width: 55px;
    height: 55px;
    border: 2px solid #444;
    display: flex;
    justify-content: center;
    align-items: center;
}
.eraserSize span {
    background: #ccc;
    border-radius: 50%;
}

/* 現在色（SafariでもPCと同じ四角表示） */
#currentColor {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 2px solid #444;
    vertical-align: middle;
}

/* 消しゴムカーソル */
#eraserCursor {
    position: absolute;
    pointer-events: none;
    border: 2px solid #000;
    border-radius: 50%;
    display: none;
}
</style>

</head>
<body>
<div id="app">
<h1>MyPaint</h1>

<!-- 色パレット -->
<div class="toolSection">
<span class="toolTitle">色</span>
<div id="palette">
<button class="color" data-color="#000000" style="background:#000000"></button>
<button class="color" data-color="#808080" style="background:#808080"></button>
<button class="color white" data-color="#ffffff" style="background:#ffffff"></button>
<button class="color" data-color="#e60012" style="background:#e60012"></button>
<button class="color" data-color="#f39800" style="background:#f39800"></button>
<button class="color" data-color="#fff100" style="background:#fff100"></button>
<button class="color" data-color="#009944" style="background:#009944"></button>
<button class="color" data-color="#00a0e9" style="background:#00a0e9"></button>
<button class="color" data-color="#0068b7" style="background:#0068b7"></button>
<button class="color" data-color="#920783" style="background:#920783"></button>
<button class="color" data-color="#8b4513" style="background:#8b4513"></button>
<button class="color" data-color="#f19ec2" style="background:#f19ec2"></button>
</div>

<label>自由色
<input type="color" id="colorPicker" value="#000000">
</label>

<span>現在色</span><span id="currentColor"></span>
</div>

<!-- ペン太さ -->
<div class="toolSection">
<span class="toolTitle">ペンの太さ</span>

<div class="penSizeRow">
    <button class="penSize" data-size="2"><span style="height:2px"></span></button>
    <button class="penSize" data-size="5"><span style="height:5px"></span></button>
    <button class="penSize" data-size="10"><span style="height:10px"></span></button>
    <button class="penSize" data-size="20"><span style="height:20px"></span></button>
</div>

<button id="penMode">ペン</button>
</div>

<!-- 消しゴム太さ -->
<div class="toolSection">
<span class="toolTitle">消しゴムの太さ</span>

<div class="eraserSizeRow">
    <button class="eraserSize" data-size="10"><span style="width:10px;height:10px;"></span></button>
    <button class="eraserSize" data-size="20"><span style="width:20px;height:20px;"></span></button>
    <button class="eraserSize" data-size="40"><span style="width:40px;height:40px;"></span></button>
    <button class="eraserSize" data-size="80"><span style="width:80px;height:80px;"></span></button>
</div>

<button id="eraserMode">消しゴム</button>
</div>

<!-- 操作ボタン -->
<div class="toolSection actions">
<button id="undo">元に戻す</button>
<button id="redo">前に進む</button>
<button id="clear">全部消す</button>
<button id="png">PNG表示</button>
<button id="saveWork">作品保存</button>
<select id="workList"><option value="">保存作品を選択</option></select>
<button id="loadWork">読込</button>
<button id="deleteWork">削除</button>
</div>

<!-- キャンバス -->
<div id="canvasWrap" style="position:relative;">
<canvas id="canvas" width="760" height="500"></canvas>
<div id="eraserCursor"></div>
</div>

<p>ペンを選び、白い枠内に描いてください。</p>

</div>

<script src="script.js?v=9400"></script>
</body>
</html>
